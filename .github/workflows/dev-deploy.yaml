name: DMS Build and Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

env:
  APP_NAME: dms
  APP_PORT: 8010
  CONTAINER_PORT: 8000
  SERVER_APP_DIR: /home/ubuntu/DMS

jobs:

  # ==========================================================
  # 1. TEST APPLICATION
  # ==========================================================

  test:

    name: Test DMS

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            tesseract-ocr \
            poppler-utils \
            libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python code
        run: |
          python -m compileall app cli.py

      - name: Run tests
        run: |
          pytest -q


  # ==========================================================
  # 2. BUILD DOCKER IMAGE
  # ==========================================================

  build:

    name: Build DMS Docker Image

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t dms:${{ github.sha }} \
            -t dms:latest \
            .

      # ------------------------------------------------------
      # Test Docker container
      # ------------------------------------------------------

      - name: Start test container
        run: |
          docker run -d \
            --name dms-ci-test \
            -p 18010:8000 \
            -e ENVIRONMENT=production \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            dms:${{ github.sha }}

      - name: Wait for DMS health
        run: |

          echo "Waiting for DMS..."

          for i in $(seq 1 30); do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:18010/api/health; then

              echo ""
              echo "DMS health check passed."

              exit 0

            fi

            echo "Attempt ${i}/30 failed."

            sleep 5

          done

          echo "DMS health check failed."

          docker logs dms-ci-test

          exit 1

      - name: Show container logs
        if: always()
        run: |
          docker logs --tail 100 dms-ci-test || true

      - name: Stop CI test container
        if: always()
        run: |
          docker rm -f dms-ci-test || true

      # ------------------------------------------------------
      # Export Docker image
      # ------------------------------------------------------

      - name: Export Docker image
        run: |
          docker save \
            dms:${{ github.sha }} \
            | gzip > dms-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4

        with:
          name: dms-docker-image-${{ github.sha }}
          path: dms-image.tar.gz
          retention-days: 1


  # ==========================================================
  # 3. DEPLOY TO MILESWEB UBUNTU SERVER
  # ==========================================================

  deploy:

    name: Deploy DMS to MilesWeb Server

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      # ------------------------------------------------------
      # Download Docker image
      # ------------------------------------------------------

      - name: Download Docker image

        uses: actions/download-artifact@v4

        with:
          name: dms-docker-image-${{ github.sha }}


      # ------------------------------------------------------
      # Install sshpass
      # ------------------------------------------------------

      - name: Install SSH password utility

        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass


      # ------------------------------------------------------
      # Test SSH connection
      # ------------------------------------------------------

      - name: Test server connection

        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "echo 'SSH connection successful'"


      # ------------------------------------------------------
      # Verify Docker
      # ------------------------------------------------------

      - name: Verify Docker on server

        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "docker version"


      # ------------------------------------------------------
      # Verify DMS directory
      # ------------------------------------------------------

      - name: Prepare DMS directory

        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo mkdir -p /home/ubuntu/DMS/data /home/ubuntu/DMS/backups"


      # ------------------------------------------------------
      # Verify existing .env
      # IMPORTANT:
      # Workflow DOES NOT overwrite .env
      # ------------------------------------------------------

      - name: Verify production environment file

        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "test -f /home/ubuntu/DMS/.env && \
             echo 'Production .env found' || \
             (echo 'ERROR: /home/ubuntu/DMS/.env not found' && exit 1)"


      # ------------------------------------------------------
      # Copy Docker image to server
      # ------------------------------------------------------

      - name: Copy Docker image

        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            -P "${{ secrets.SERVER_PORT }}" \
            dms-image.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/dms-image.tar.gz"


      # ======================================================
      # DEPLOY
      # ======================================================

      - name: Deploy DMS

        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo bash -s" <<'REMOTE_SCRIPT'

          set -e

          APP_DIR="/home/ubuntu/DMS"

          IMAGE="dms:${{ github.sha }}"

          CONTAINER="dms"

          PORT="8010"


          echo "========================================"

          echo "DMS Deployment Started"

          echo "Application directory: ${APP_DIR}"

          echo "Image: ${IMAGE}"

          echo "Container: ${CONTAINER}"

          echo "Port: ${PORT}"

          echo "========================================"


          # --------------------------------------------------
          # Verify .env
          # --------------------------------------------------

          if [ ! -f "${APP_DIR}/.env" ]; then

            echo "ERROR: ${APP_DIR}/.env does not exist"

            exit 1

          fi


          chmod 600 "${APP_DIR}/.env"


          # --------------------------------------------------
          # Verify Docker
          # --------------------------------------------------

          docker version


          # --------------------------------------------------
          # Load Docker image
          # --------------------------------------------------

          echo "Loading Docker image..."

          gunzip -c /tmp/dms-image.tar.gz | docker load


          # --------------------------------------------------
          # Verify image
          # --------------------------------------------------

          docker image inspect "${IMAGE}" > /dev/null

          echo "Docker image verified."


          # --------------------------------------------------
          # Check ONLY DMS container
          # --------------------------------------------------

          if docker ps -a \
            --format '{{.Names}}' \
            | grep -qx "${CONTAINER}"; then

            echo "Existing DMS container found."

            echo "Stopping ONLY DMS container..."

            docker stop "${CONTAINER}" || true

            echo "Removing ONLY DMS container..."

            docker rm "${CONTAINER}" || true

          else

            echo "No existing DMS container found."

          fi


          # --------------------------------------------------
          # Start DMS
          # --------------------------------------------------

          echo "Starting DMS container..."


          docker run -d \
            --name "${CONTAINER}" \
            --restart unless-stopped \
            -p "127.0.0.1:${PORT}:8000" \
            --env-file "${APP_DIR}/.env" \
            -v "${APP_DIR}/data:/app/data" \
            --cpus="2.0" \
            --memory="2g" \
            "${IMAGE}"


          # --------------------------------------------------
          # Wait for Docker health
          # --------------------------------------------------

          echo "Waiting for DMS health..."


          HEALTH="starting"


          for i in $(seq 1 30); do

            HEALTH=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "${CONTAINER}" \
              2>/dev/null || echo "starting")


            echo "Health attempt ${i}/30: ${HEALTH}"


            if [ "${HEALTH}" = "healthy" ]; then

              echo ""

              echo "========================================"

              echo "DMS DEPLOYMENT SUCCESSFUL"

              echo "========================================"


              docker ps \
                --filter "name=${CONTAINER}"


              curl \
                --fail \
                --silent \
                http://127.0.0.1:${PORT}/api/health


              echo ""

              exit 0

            fi


            sleep 5

          done


          # --------------------------------------------------
          # Deployment failed
          # --------------------------------------------------

          echo ""

          echo "========================================"

          echo "DMS DEPLOYMENT FAILED"

          echo "========================================"


          docker ps -a \
            --filter "name=${CONTAINER}"


          docker logs \
            --tail 200 \
            "${CONTAINER}" || true


          exit 1

          REMOTE_SCRIPT


      # ------------------------------------------------------
      # Cleanup temporary image
      # ------------------------------------------------------

      - name: Cleanup server temporary files

        if: always()

        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo rm -f /tmp/dms-image.tar.gz"


      # ------------------------------------------------------
      # Deployment complete
      # ------------------------------------------------------

      - name: Deployment summary

        run: |

          echo "========================================"

          echo "DMS DEPLOYMENT COMPLETED"

          echo "========================================"

          echo "Server path: /home/ubuntu/DMS"

          echo "Container: dms"

          echo "Application port: 8010"

          echo "Container port: 8000"

          echo "Environment: /home/ubuntu/DMS/.env"

          echo "Persistent data: /home/ubuntu/DMS/data"

          echo "========================================"
