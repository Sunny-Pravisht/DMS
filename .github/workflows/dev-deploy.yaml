name: DMS Build and Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

env:
  APP_NAME: dms
  APP_PORT: 8010
  SERVER_APP_DIR: /opt/dms

jobs:

  # ==========================================================
  # 1. TEST
  # ==========================================================

  test:

    name: Test DMS

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            poppler-utils \
            libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python code
        run: |
          python -m compileall app cli.py

      - name: Run tests
        run: |
          pytest -q


  # ==========================================================
  # 2. BUILD + TEST DOCKER IMAGE
  # ==========================================================

  build:

    name: Build and Test Docker Image

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t dms:${{ github.sha }} \
            -t dms:latest \
            .

      - name: Start DMS test container
        run: |
          docker run -d \
            --name dms-ci-test \
            -p 18010:8000 \
            -e ENVIRONMENT=production \
            -e SECRET_KEY="${{ secrets.DMS_SECRET_KEY }}" \
            dms:${{ github.sha }}

      - name: Wait for DMS health
        run: |

          echo "Waiting for DMS..."

          for i in $(seq 1 30); do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:18010/api/health; then

              echo ""
              echo "DMS health check passed."
              exit 0

            fi

            echo "Attempt ${i}/30 failed."

            sleep 5

          done

          echo "DMS health check failed."

          docker logs dms-ci-test

          exit 1

      - name: Show logs
        if: always()
        run: |
          docker logs --tail 100 dms-ci-test || true

      - name: Remove test container
        if: always()
        run: |
          docker rm -f dms-ci-test || true

      - name: Export Docker image
        run: |
          docker save \
            dms:${{ github.sha }} \
            | gzip > dms-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: dms-docker-image-${{ github.sha }}
          path: dms-image.tar.gz
          retention-days: 1


  # ==========================================================
  # 3. DEPLOY TO MILESWEB
  # ==========================================================

  deploy:

    name: Deploy DMS to MilesWeb

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: dms-docker-image-${{ github.sha }}

      # ------------------------------------------------------
      # Install sshpass
      # ------------------------------------------------------

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # ------------------------------------------------------
      # Create SSH options
      # ------------------------------------------------------

      - name: Prepare SSH
        run: |

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan \
            -p "${{ secrets.SERVER_PORT }}" \
            -H "${{ secrets.SERVER_HOST }}" \
            > ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      # ------------------------------------------------------
      # Test password login
      # ------------------------------------------------------

      - name: Test SSH connection
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "echo 'SSH connection successful'"

      # ------------------------------------------------------
      # Create DMS directories
      # ------------------------------------------------------

      - name: Prepare DMS directory
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p /opt/dms/data /opt/dms/backups && \
             chown -R 1000:1000 /opt/dms/data /opt/dms/backups"

      # ------------------------------------------------------
      # Create production .env
      # ------------------------------------------------------

      - name: Create production environment
        run: |

          cat > dms.env <<EOF
          ENVIRONMENT=production
          SECRET_KEY=${{ secrets.DMS_SECRET_KEY }}

          DATABASE_URL=sqlite:///./data/documents.db

          DATA_FOLDER=./data
          STAGING_FOLDER=./data/staging
          STORAGE_FOLDER=./data/storage
          LOGS_FOLDER=./data/logs
          BACKUP_FOLDER=./data/backups

          EMBEDDING_PROVIDER=local
          OCR_ENGINE=auto

          TESSERACT_PATH=/usr/bin/tesseract
          POPPLER_PATH=/usr/bin

          LOG_LEVEL=INFO
          TRUSTED_PROXY_IPS=127.0.0.1
          EOF

      - name: Add Groq configuration
        if: ${{ secrets.GROQ_API_KEY != '' }}

        run: |

          echo "AI_PROVIDER=groq" >> dms.env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> dms.env

      # ------------------------------------------------------
      # Copy image
      # ------------------------------------------------------

      - name: Copy Docker image to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e scp \
            -P "${{ secrets.SERVER_PORT }}" \
            -o StrictHostKeyChecking=yes \
            dms-image.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/dms-image.tar.gz"

      # ------------------------------------------------------
      # Copy environment
      # ------------------------------------------------------

      - name: Copy environment to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e scp \
            -P "${{ secrets.SERVER_PORT }}" \
            -o StrictHostKeyChecking=yes \
            dms.env \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/dms.env"

      # ======================================================
      # DEPLOY ONLY DMS
      # ======================================================

      - name: Deploy DMS
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "bash -s" <<REMOTE_SCRIPT

          set -e

          APP_DIR="/opt/dms"
          IMAGE="dms:${{ github.sha }}"
          CONTAINER="dms"
          PORT="8010"

          echo "========================================"
          echo "DMS Deployment Started"
          echo "Image: \${IMAGE}"
          echo "========================================"

          # -----------------------------------------------
          # Prepare directories
          # -----------------------------------------------

          mkdir -p "\${APP_DIR}/data"
          mkdir -p "\${APP_DIR}/backups"

          cp /tmp/dms.env "\${APP_DIR}/.env"
          chmod 600 "\${APP_DIR}/.env"

          # -----------------------------------------------
          # Load Docker image
          # -----------------------------------------------

          echo "Loading Docker image..."

          gunzip -c /tmp/dms-image.tar.gz | docker load

          # -----------------------------------------------
          # Verify image
          # -----------------------------------------------

          docker image inspect "\${IMAGE}" > /dev/null

          # -----------------------------------------------
          # Stop ONLY DMS
          # -----------------------------------------------

          if docker ps -a \
            --format '{{.Names}}' \
            | grep -qx "\${CONTAINER}"; then

            echo "Existing DMS container found."

            docker stop "\${CONTAINER}" || true

            docker rm "\${CONTAINER}" || true

          fi

          # -----------------------------------------------
          # Start ONLY DMS
          # -----------------------------------------------

          echo "Starting DMS..."

          docker run -d \
            --name "\${CONTAINER}" \
            --restart unless-stopped \
            -p "127.0.0.1:\${PORT}:8000" \
            --env-file "\${APP_DIR}/.env" \
            -v "\${APP_DIR}/data:/app/data" \
            --cpus="2.0" \
            --memory="2g" \
            "\${IMAGE}"

          # -----------------------------------------------
          # Health check
          # -----------------------------------------------

          echo "Waiting for DMS health..."

          for i in \$(seq 1 30); do

            HEALTH=\$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "\${CONTAINER}" \
              2>/dev/null || echo "starting")

            echo "Health attempt \${i}/30: \${HEALTH}"

            if [ "\${HEALTH}" = "healthy" ]; then

              echo ""
              echo "========================================"
              echo "DMS DEPLOYMENT SUCCESSFUL"
              echo "========================================"

              docker ps --filter "name=\${CONTAINER}"

              exit 0

            fi

            sleep 5

          done

          echo "========================================"
          echo "DMS DEPLOYMENT FAILED"
          echo "========================================"

          docker ps -a --filter "name=\${CONTAINER}"

          docker logs --tail 200 "\${CONTAINER}" || true

          exit 1

          REMOTE_SCRIPT

      # ------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------

      - name: Cleanup temporary files
        if: always()

        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

        run: |

          sshpass -e ssh \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "rm -f /tmp/dms-image.tar.gz /tmp/dms.env"
