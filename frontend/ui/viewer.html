<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document · DMS</title>
  <link rel="icon" type="image/png" href="/static/ui/assets/brand/harman-mark-64.png">
  <link rel="stylesheet" href="/static/ui/css/dms.css">
  <style>
    /* This page is the document and nothing else, so it drops the shell:
       no sidebar, no navigation, no page padding. Long documents are read
       here, and everything on screen that is not the document is a
       distraction from it. */
    body { overflow: auto; }
    @media print {
      .viewer-bar { display: none; }
      .viewer-shell { height: auto; }
    }
    .version-modal-backdrop { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:0; background:rgba(3,31,48,.56); }
    .version-modal-backdrop.is-open { display:flex; }
    .version-modal { width:min(760px,100%); max-height:min(760px,calc(100vh - 40px)); overflow:hidden; background:#fff; border-radius:14px; box-shadow:0 22px 70px rgba(0,0,0,.3); display:flex; flex-direction:column; }
    .compare-modal { width:100%; height:100%; overflow:hidden; background:#fff; border-radius:0; box-shadow:none; display:flex; flex-direction:column; }
    .version-modal__head { flex:0 0 auto; display:flex; align-items:flex-start; gap:12px; padding:18px 20px 14px; }
    .version-modal__head > div:first-child { min-width:0; }
    .version-modal__body { flex:1 1 auto; min-height:0; overflow:auto; padding:18px 20px; }
    .version-modal__foot { flex:0 0 auto; padding:12px 20px; }
    .compare-modal .version-modal__body { min-height:0; overflow:auto; }
    .compare-modal .version-modal__head { flex-shrink:0; }
    .compare-modal .version-modal__foot { flex-shrink:0; }
    .compare-modal .version-modal__body { padding:12px; }
    .compare-modal .version-result { margin-top:12px; }
    .compare-modal .compare-pane__body { max-height:none; min-height:360px; }
    .compare-modal .compare-file iframe { height:calc(100vh - 112px); min-height:480px; }
    .compare-launch { margin-top:16px; }
    .version-tabs { display:flex; gap:8px; align-items:center; }
    @media (max-width:650px) { .compare-modal { height:calc(100vh - 20px); } }
    .version-modal__foot { justify-content:flex-end; border-top:1px solid #e6edf1; border-bottom:0; }
    .version-modal__foot .btn { flex:0 0 auto; }
    .version-list { display:grid; gap:8px; margin:12px 0 20px; }
    .version-item { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid #dce8ee; border-radius:9px; }
    .version-item__body { flex:1; min-width:0; }
    .version-compare { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; }
    .version-result { margin-top:14px; border:1px solid #dce8ee; border-radius:10px; overflow:hidden; background:#f8fbfc; }
    .compare-summary { padding:12px 14px; border-bottom:1px solid #dce8ee; font-size:13px; }
    .compare-summary.is-different { color:#7a3e00; background:#fff8ed; }
    .compare-summary.is-same { color:#176044; background:#effaf5; }
    .compare-columns { display:grid; grid-template-columns:1fr 1fr; }
    .compare-pane { min-width:0; }
    .compare-pane + .compare-pane { border-left:1px solid #dce8ee; }
    .compare-pane__head { padding:9px 12px; font-weight:700; font-size:12px; color:#35566a; background:#eef5f8; }
    .compare-pane__body { margin:0; padding:12px; min-height:90px; max-height:260px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; color:#173042; }
    .compare-note { padding:12px 14px; color:#526b78; font-size:13px; }
    .compare-files { display:grid; grid-template-columns:1fr 1fr; }
    .compare-file { min-width:0; }
    .compare-file + .compare-file { border-left:1px solid #dce8ee; }
    .compare-file__head { padding:9px 12px; font-weight:700; font-size:12px; color:#35566a; background:#eef5f8; }
    .compare-file iframe { display:block; width:100%; height:360px; border:0; background:#eef2f4; }
    .compare-open { margin:8px 12px 12px; }
    @media (max-width:650px) { .version-compare, .compare-columns, .compare-files { grid-template-columns:1fr; } .compare-file + .compare-file { border-left:0; border-top:1px solid #dce8ee; } .compare-pane + .compare-pane { border-left:0; border-top:1px solid #dce8ee; } .version-compare > button { width:100%; }
  </style>
</head>

<body>
  <div class="viewer-shell">
    <header class="viewer-bar">
      <a class="icon-btn tip" data-tip="Back to the document" id="back" href="/documents">
        <i data-icon="chevronLeft"></i></a>
      <div style="min-width:0">
        <div class="viewer-bar__title truncate" id="v-title">Loading…</div>
        <div class="viewer-bar__meta truncate" id="v-meta">&nbsp;</div>
      </div>
      <span class="spacer"></span>
      <span class="badge badge--accent" id="v-badge" hidden></span>
      <a class="btn btn--outline btn--sm" id="v-edit" hidden><i data-icon="compose"></i>Edit</a>
      <button class="btn btn--outline btn--sm" id="v-versions"><i data-icon="history"></i>Versions</button>
      <button class="btn btn--outline btn--sm" id="open-compare" type="button"><i data-icon="history"></i>Compare versions</button>
      <a class="btn btn--outline btn--sm" id="v-detail" hidden><i data-icon="external"></i>Details</a>
    </header>

    <div class="viewer viewer--full" id="viewer"></div>
  </div>

  <div class="version-modal-backdrop" id="compare-modal" aria-hidden="true">
    <section class="compare-modal" role="dialog" aria-modal="true" aria-labelledby="compare-modal-title">
      <header class="version-modal__head"><div><div class="t-h3" id="compare-modal-title">Compare versions</div><div class="t-sm muted">Compare two saved versions side by side.</div></div><span class="spacer"></span><button class="icon-btn" type="button" data-compare-close aria-label="Close">×</button></header>
      <div class="version-modal__body" id="compare-modal-body"></div>
      <footer class="version-modal__foot"><button class="btn btn--sm btn--outline" type="button" data-compare-close>Close</button></footer>
    </section>
  </div>

  <div class="version-modal-backdrop" id="version-modal" aria-hidden="true">
    <section class="version-modal" role="dialog" aria-modal="true" aria-labelledby="version-modal-title">
      <header class="version-modal__head">
        <div><div class="t-h3" id="version-modal-title">Version history</div><div class="t-sm muted">Open, compare, or check out a saved version.</div></div>
        <span class="spacer"></span><button class="icon-btn" type="button" data-version-close aria-label="Close">×</button>
      </header>
      <div class="version-modal__body" id="version-modal-body"></div>
      <footer class="version-modal__foot"><button class="btn btn--sm btn--outline" type="button" data-version-close>Close</button></footer>
    </section>
  </div>

  <script src="/static/ui/js/shell.js"></script>
  <script src="/static/ui/js/viewer.js"></script>
  <script>
    (function () {
      const { api, confirmDanger, escapeHtml, fmt, toast } = DMS;
      const id = new URLSearchParams(location.search).get('id');
      const $ = s => document.querySelector(s);
      const versionModal = $('#version-modal');
      const versionModalBody = $('#version-modal-body');
      let versions = [];

      if (!id) {
        $('#v-title').textContent = 'No document selected';
        $('#viewer').innerHTML =
          '<div class="viewer__stage"><div class="viewer__fallback">' +
          '<h3 class="t-h3">Nothing to show</h3>' +
          '<p class="t-sm muted mt-2">Open a document from the repository and choose ' +
          '“Open in a new tab”.</p>' +
          '<div class="btn-row mt-3" style="justify-content:center">' +
          '<a class="btn btn--primary btn--sm" href="/documents">Go to the repository</a>' +
          '</div></div></div>';
        return;
      }

      $('#v-detail').href = '/documents/detail?id=' + encodeURIComponent(id);
      $('#back').href = '/documents';

      function closeVersions() {
        versionModal.classList.remove('is-open');
        versionModal.setAttribute('aria-hidden', 'true');
      }

      function versionLabel(version) {
        return 'v' + escapeHtml(version || '1.0');
      }

      function renderVersions() {
        if (!versions.length) {
          versionModalBody.innerHTML = '<p class="t-sm muted">No versions have been recorded yet.</p>';
          return;
        }
        const options = versions.map(v => '<option value="' + escapeHtml(v.id) + '">' + versionLabel(v.version) + '</option>').join('');
        // The API returns newest first. Older must be the second item and
        // newer must be the first item so the comparison direction is honest.
        const older = versions[1] ? versions[1].id : versions[0].id;
        const newer = versions[0].id;
        versionModalBody.innerHTML =
          '<div class="version-list">' + versions.map(v =>
            '<div class="version-item"><span class="version__tag' + (v.is_locked ? ' is-locked' : '') + '">' + versionLabel(v.version) + '</span>' +
            '<div class="version-item__body"><div class="truncate">' + escapeHtml(v.note || 'Saved version') + '</div>' +
            '<div class="t-xs muted">' + (v.author ? escapeHtml(v.author) + ' · ' : '') + fmt.dateTime(v.created_at) + ' · ' + fmt.bytes(v.file_size) + '</div></div>' +
            (v.is_current ? '<span class="badge badge--accent">Current</span>' : '') +
            (v.is_locked ? '<span class="badge">Locked</span>' : '') +
            '<a class="btn btn--sm btn--ghost" target="_blank" rel="noopener" href="' + escapeHtml(v.file_url) + '" title="Open this exact saved file">Open exact file</a>' +
            (!v.is_current ? '<button class="btn btn--sm btn--outline" type="button" data-checkout="' + escapeHtml(v.id) + '">Check out this version</button>' : '<span class="t-xs muted">Current working copy</span>') +
            '</div>'
          ).join('') + '</div>' +
            '';
          $('#open-compare').disabled = versions.length < 2;
      }

      async function openVersions() {
        versionModal.classList.add('is-open');
        versionModal.setAttribute('aria-hidden', 'false');
        versionModalBody.innerHTML = '<p class="t-sm muted">Loading version history…</p>';
        try {
          const data = await api.get('/api/documents/' + encodeURIComponent(id) + '/versions');
          versions = data.versions || [];
          renderVersions();
        } catch (err) {
          versionModalBody.innerHTML = '<p class="t-sm" style="color:var(--danger)">Could not load versions.</p>';
          toast('Could not load versions', String(err.message || err), 'danger');
        }
      }

      async function compareVersions() {
        const left = $('#compare-left').value;
        const right = $('#compare-right').value;
        const result = $('#version-result');
        if (!left || !right || left === right) { result.innerHTML = '<div class="compare-note">Choose two different versions.</div>'; return; }
        result.innerHTML = '<div class="compare-note">Comparing…</div>';
        try {
          const data = await api.get('/api/documents/' + encodeURIComponent(id) + '/versions/' + encodeURIComponent(left) + '/compare/' + encodeURIComponent(right));
          const same = !data.different;
          const summary = '<div class="compare-summary ' + (same ? 'is-same' : 'is-different') + '"><strong>' +
            (same ? 'No changes found' : 'Versions are different') + '</strong><br>' +
            escapeHtml(versionLabel(data.left_version) + ' · ' + fmt.bytes(data.left_size)) +
            ' <span class="muted">compared with</span> ' +
            escapeHtml(versionLabel(data.right_version) + ' · ' + fmt.bytes(data.right_size)) + '</div>';
          const panes = data.comparison_mode === 'text'
            ? '<div class="compare-columns"><section class="compare-pane"><div class="compare-pane__head">' + versionLabel(data.left_version) + ' · Changed / removed</div><pre class="compare-pane__body">' + escapeHtml(data.left_excerpt || 'No changed lines') + '</pre></section>' +
              '<section class="compare-pane"><div class="compare-pane__head">' + versionLabel(data.right_version) + ' · Changed / added</div><pre class="compare-pane__body">' + escapeHtml(data.right_excerpt || 'No changed lines') + '</pre></section></div>'
            : '<div class="compare-files"><section class="compare-file"><div class="compare-file__head">' + versionLabel(data.left_version) + ' · Older exact file</div><iframe title="Older exact file" src="/api/documents/' + encodeURIComponent(id) + '/versions/' + encodeURIComponent(left) + '/file#view=FitH&navpanes=0&zoom=page-width"></iframe><a class="btn btn--sm btn--ghost compare-open" target="_blank" rel="noopener" href="/api/documents/' + encodeURIComponent(id) + '/versions/' + encodeURIComponent(left) + '/file">Open older PDF</a></section>' +
              '<section class="compare-file"><div class="compare-file__head">' + versionLabel(data.right_version) + ' · Newer exact file</div><iframe title="Newer exact file" src="/api/documents/' + encodeURIComponent(id) + '/versions/' + encodeURIComponent(right) + '/file#view=FitH&navpanes=0&zoom=page-width"></iframe><a class="btn btn--sm btn--ghost compare-open" target="_blank" rel="noopener" href="/api/documents/' + encodeURIComponent(id) + '/versions/' + encodeURIComponent(right) + '/file">Open newer PDF</a></section></div>';
          const note = data.comparison_note && data.comparison_mode === 'text'
            ? '<div class="compare-note">' + escapeHtml(data.comparison_note) + '</div>' : '';
          result.innerHTML = summary + note + panes;
        } catch (err) {
          result.innerHTML = '<div class="compare-note">Could not compare these versions.</div>';
          toast('Could not compare versions', String(err.message || err), 'danger');
        }
      }

      const compareModal = $('#compare-modal');
      const compareModalBody = $('#compare-modal-body');
      function closeCompare() {
        compareModal.classList.remove('is-open');
        compareModal.setAttribute('aria-hidden', 'true');
      }
      $('#open-compare').addEventListener('click', async () => {
        if (!versions.length) {
          try {
            const data = await api.get('/api/documents/' + encodeURIComponent(id) + '/versions');
            versions = data.versions || [];
          } catch (err) {
            toast('Could not load versions', String(err.message || err), 'danger');
            return;
          }
        }
        if (versions.length < 2) {
          toast('Not enough versions', 'At least two saved versions are needed to compare.', 'danger');
          return;
        }
        const options = versions.map(v => '<option value="' + escapeHtml(v.id) + '">' + versionLabel(v.version) + '</option>').join('');
        compareModalBody.innerHTML = '<p class="t-sm muted">Select two saved versions. Text files show changed lines; PDFs and images open as exact files side by side.</p>' +
          '<div class="version-compare"><label class="field"><span class="field__label">Older version</span><select class="select" id="compare-left">' + options + '</select></label>' +
          '<label class="field"><span class="field__label">Newer version</span><select class="select" id="compare-right">' + options + '</select></label>' +
          '<button class="btn btn--primary btn--sm" type="button" id="compare-versions">Compare</button></div>' +
          '<div class="version-result" id="version-result"><div class="compare-note">Choose two different versions to see their differences.</div></div>';
        $('#compare-left').value = versions[1].id;
        $('#compare-right').value = versions[0].id;
        closeVersions();
        compareModal.classList.add('is-open');
        compareModal.setAttribute('aria-hidden', 'false');
      });
      compareModal.addEventListener('click', async e => {
        if (e.target === compareModal || e.target.closest('[data-compare-close]')) { closeCompare(); return; }
        if (e.target.closest('#compare-versions')) { await compareVersions(); return; }
      });
      $('#v-versions').addEventListener('click', openVersions);
      versionModal.addEventListener('click', async e => {
        if (e.target === versionModal || e.target.closest('[data-version-close]')) { closeVersions(); return; }
        if (e.target.closest('#compare-versions')) { await compareVersions(); return; }
        const checkout = e.target.closest('[data-checkout]');
        if (!checkout) return;
        const version = versions.find(v => v.id === checkout.dataset.checkout);
        const ok = await confirmDanger({
          title: 'Check out ' + versionLabel(version && version.version) + '?',
          message: 'This makes the selected saved version the current working copy. No version history is deleted.',
          confirmLabel: 'Check out version'
        });
        if (!ok) return;
        checkout.disabled = true;
        try {
          await api.post('/api/documents/' + encodeURIComponent(id) + '/versions/' + encodeURIComponent(checkout.dataset.checkout) + '/checkout', {});
          toast('Version checked out', versionLabel(version && version.version) + ' is now the current working copy.');
          // Reload the whole viewer so its file, title, version badge, and
          // history all reflect the newly selected working version together.
          window.location.reload();
        } catch (err) {
          checkout.disabled = false;
          toast('Could not check out version', String(err.message || err), 'danger');
        }
      });

      (async function () {
        const info = await DMSViewer.mount($('#viewer'), id, { full: true });
        if (!info) { $('#v-title').textContent = 'Document unavailable'; return; }

        document.title = (info.title || 'Document') + ' · DMS';
        $('#v-title').textContent = info.title || info.filename || 'Untitled';
        $('#v-meta').textContent = [
          info.filename,
          fmt.bytes(info.file_size),
          info.page_hint ? info.page_hint + (info.page_hint === 1 ? ' page' : ' pages') : '',
          'v' + (info.version || '1.0'),
        ].filter(Boolean).join('  ·  ');

        if (info.origin === 'composed') {
          const badge = $('#v-badge');
          badge.hidden = false;
          badge.textContent = 'Written in the Studio';
        }

        await DMS.ready;
        const me = DMS.me || {};
        const isAdmin = !!me.is_admin;
        const permissions = me.permissions || [];
        const canEdit = isAdmin || permissions.includes('documents.update');
        const canDownload = isAdmin || permissions.includes('documents.read');
        const edit = $('#v-edit');
        const detail = $('#v-detail');
        if (info.editable && canEdit) {
          edit.hidden = false;
          edit.href = '/studio?id=' + encodeURIComponent(id);
        }
        if (isAdmin || canDownload) detail.hidden = false;
      })();
    })();
  </script>
</body>

</html>
